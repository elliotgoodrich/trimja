name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        environment: [
          # Linux (Clang) and MacOS must use the oldest GitHub Action runner
          # since we want to compile against the oldest libc version
          # possible.  This means that all binaries created will be compatible
          # with all GitHub Action runners.
          {name: Linux (clang), image: ubuntu-22.04, cpp: clang++-13, c: clang-13, clang-tidy: true},
          {name: MacOS, image: macos-15, cpp: clang++, c: clang},
          {name: Windows, image: windows-latest, cpp: cl, c: cl},
        ]
    name: ${{ matrix.environment.name }}
    runs-on: ${{ matrix.environment.image }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # NOTE: the Configure CMake/Build/Test steps below are duplicated in
    # ci.yaml (for the full environment/build_type matrix, plus trimja).
    # Keep the two in sync when editing either one.  The extra
    # -DTRIMJA_VERSION_OVERRIDE flag is release-only: it pins the built version
    # to the release tag rather than deriving it from `git describe` (the
    # checkout here is shallow and has no tags).  The flag is quoted because
    # Windows PowerShell otherwise splits a value like `v1.4.0` at the first
    # `.`, passing only `v1` to CMake; the quotes are harmless under bash.
    # Ninja, unlike the Visual Studio generator, needs the environment a
    # Developer Command Prompt sets up (cl, INCLUDE, LIB, and Visual Studio's
    # bundled ninja on PATH), so export what vcvars64.bat changes to the steps
    # below.
    - name: Set up MSVC environment
      if: matrix.environment.name == 'Windows'
      shell: powershell
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
          $name, $value = $_ -split '=', 2
          if ($before[$name] -ne $value) { "$name=$value" }
        } | Add-Content $env:GITHUB_ENV
    - name: Configure CMake
      run: >
        cmake -B output
        -DCMAKE_CXX_COMPILER=${{ matrix.environment.cpp }}
        -DCMAKE_C_COMPILER=${{ matrix.environment.c }}
        "-DTRIMJA_VERSION_OVERRIDE=${{ github.event.release.tag_name }}"
        -DCMAKE_BUILD_TYPE=Release
        -G Ninja
        ${{ matrix.environment.clang-tidy && '-DENABLE_CLANG_TIDY=ON' || ''}}
    - name: Build
      run: cmake --build output --config Release
    - name: Test
      run: cmake --build output --target run_test_with_dependencies --config Release
    - name: Install NSIS
      # windows-latest no longer ships NSIS, but we need it to build the .exe installer
      if: matrix.environment.name == 'Windows'
      run: choco install nsis -y --no-progress
    - name: Install
      run: cmake --build output --config Release --target package
    - name: Upload package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package-${{ matrix.environment.name }}
        if-no-files-found: ignore
        path: |
          output/trimja-*-Linux.tar.gz
          output/trimja-*-Darwin.tar.gz
          output/trimja-*-win64.exe
          output/trimja-*.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required by actions/attest-build-provenance.
      id-token: write
      attestations: write
    steps:
    - name: Download packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: package-*
        path: output
        merge-multiple: true
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          output/trimja-*-Linux.tar.gz
          output/trimja-*-Darwin.tar.gz
          output/trimja-*-win64.exe
          output/trimja-*.zip
    # Attach the built packages to the release that triggered this workflow.
    # The release notes are whatever was entered in the GitHub UI on publish;
    # this step only uploads assets and leaves the body untouched.
    - name: Upload release assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.event.release.tag_name }}
        fail_on_unmatched_files: true
        files: |
          output/trimja-*-Linux.tar.gz
          output/trimja-*-Darwin.tar.gz
          output/trimja-*-win64.exe
          output/trimja-*.zip
