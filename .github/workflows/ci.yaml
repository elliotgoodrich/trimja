name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * SAT'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        environment: [
          # Linux (Clang) and MacOS must use the oldest GitHub Action runner
          # since we want to compile against the oldest libc version
          # possible.  This means that all binaries created will be compatible
          # with all GitHub Action runners. For Linux (GCC) with choose the
          # oldest version that supports everything we have on the other
          # platforms to maximise compiler compatibility.
          {name: Linux (clang), image: ubuntu-22.04, cpp: clang++-13, c: clang-13, clang-tidy: true},
          {name: Linux (gcc), image: ubuntu-22.04, cpp: g++-12, c: gcc-12},
          {name: MacOS, image: macos-15, cpp: clang++, c: clang},
          {name: Windows, image: windows-latest, cpp: cl, c: cl},
          # Compile on the latest clang to get the latest clang-tidy
          {name: Linux (clang-latest), image: ubuntu-latest, cpp: clang++, c: clang, clang-tidy: true},
        ]
        build_type: [Debug, Release]
    name: ${{ matrix.environment.name }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.environment.image }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # NOTE: the Configure CMake/Build/Test steps below are duplicated in
    # release.yaml (for the packaging-relevant environments, Release only).
    # Keep the two in sync when editing either one.
    # Ninja, unlike the Visual Studio generator, needs the environment a
    # Developer Command Prompt sets up (cl, INCLUDE, LIB, and Visual Studio's
    # bundled ninja on PATH), so export what vcvars64.bat changes to the steps
    # below.
    - name: Set up MSVC environment
      if: matrix.environment.name == 'Windows'
      shell: powershell
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
          $name, $value = $_ -split '=', 2
          if ($before[$name] -ne $value) { "$name=$value" }
        } | Add-Content $env:GITHUB_ENV
    - name: Configure CMake
      run: >
        cmake -B output
        -DCMAKE_CXX_COMPILER=${{ matrix.environment.cpp }}
        -DCMAKE_C_COMPILER=${{ matrix.environment.c }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -G Ninja
        ${{ matrix.environment.clang-tidy && '-DENABLE_CLANG_TIDY=ON' || ''}}
    - uses: elliotgoodrich/trimja-action@20be5f7dcf268daeaca0074b8f38254687dfed00 # v3.0.1
      with:
        version: 1.4.1
        path: output/build.ninja
        build-configuration: ${{ matrix.environment.name }} ${{ matrix.build_type }}
        target-default: true
        targets: |
          run_test_with_dependencies
        explain: true
    - name: Build
      run: cmake --build output --config ${{ matrix.build_type }}
    - name: Test
      run: cmake --build output --target run_test_with_dependencies --config ${{ matrix.build_type }}
  format:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run clang-format
      run: >
        git ls-files -z
        'src/*.c' 'src/*.h' 'src/*.cpp' 'src/*.hpp'
        'src/*.cc' 'src/*.hh' 'src/*.cxx' 'src/*.hxx'
        | xargs -0 clang-format --dry-run --Werror
